name: Build custom FFmpeg WASM

on:
  push:
    branches: [main]
    paths:
      - ffmpeg/**
      - .github/workflows/build-ffmpeg-wasm.yml
  pull_request:
    paths:
      - ffmpeg/**
      - .github/workflows/build-ffmpeg-wasm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FFmpeg WebAssembly artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FFmpeg WASM
        uses: docker/build-push-action@v6
        with:
          context: ./ffmpeg
          file: ./ffmpeg/Dockerfile
          target: export
          push: false
          outputs: type=local,dest=dist/ffmpeg-wasm
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify build output
        run: |
          set -euo pipefail
          test -s dist/ffmpeg-wasm/ffmpeg-to_mp4.js
          test -s dist/ffmpeg-wasm/ffmpeg-to_mp4.wasm
          file dist/ffmpeg-wasm/ffmpeg-to_mp4.js
          file dist/ffmpeg-wasm/ffmpeg-to_mp4.wasm
          ls -la dist/ffmpeg-wasm

      - name: Upload FFmpeg WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-to_mp4-${{ github.sha }}
          path: dist/ffmpeg-wasm/
          if-no-files-found: error
