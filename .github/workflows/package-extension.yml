name: Package Chrome extension

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Chrome Web Store zip for plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Package extension zip
        id: pack
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          ASSET_NAME="exergy∞xframe-chrome-plugin-${VERSION}.zip"
          mkdir -p dist

          # Stage a CWS package without FFmpeg WASM / transcoding fallback.
          STAGE="$(mktemp -d)"
          trap 'rm -rf "${STAGE}"' EXIT
          cp -a extension/. "${STAGE}/"
          rm -rf "${STAGE}/ffmpeg"
          printf '%s\n' \
            '/** Packaged builds disable FFmpeg WebM→MP4 transcoding. */' \
            'const FRAMEIT_FFMPEG_TRANSCODING = false;' \
            > "${STAGE}/ffmpegConfig.js"

          # Chrome Web Store expects manifest.json at the zip root.
          (
            cd "${STAGE}"
            zip -r -q "${GITHUB_WORKSPACE}/dist/${ASSET_NAME}" . \
              -x "*.DS_Store" \
              -x "**/.DS_Store" \
              -x "*~" \
              -x "*/.git/*"
          )

          if unzip -l "dist/${ASSET_NAME}" | grep -E 'ffmpeg/|ffmpeg-to_mp4'; then
            echo "Error: packaged zip must not include FFmpeg transcoding assets" >&2
            exit 1
          fi
          if ! unzip -p "dist/${ASSET_NAME}" ffmpegConfig.js | grep -q 'FRAMEIT_FFMPEG_TRANSCODING = false'; then
            echo "Error: packaged zip must disable FFmpeg transcoding" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "asset_path=dist/${ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"

          echo "Created dist/${ASSET_NAME}"
          unzip -l "dist/${ASSET_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.asset_name }}
          path: ${{ steps.pack.outputs.asset_path }}
          archive: false
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.pack.outputs.asset_path }}" \
            --clobber
