<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Microphone setup — Exergy ∞ xFrame</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #10131a;
        color: #f4f6fb;
      }
      main {
        width: min(440px, calc(100% - 48px));
        padding: 32px;
        border: 1px solid #303745;
        border-radius: 16px;
        background: #191e28;
        box-shadow: 0 18px 48px rgb(0 0 0 / 35%);
      }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0 0 24px; color: #c6ccda; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 9px;
        padding: 11px 18px;
        background: #6f7cff;
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      button:disabled { cursor: default; opacity: 0.65; }
      #status { min-height: 24px; margin-top: 18px; margin-bottom: 0; }
      #status.error { color: #ff9a9a; }
      #status.success { color: #8ee6ad; }
    </style>
  </head>
  <body>
    <main>
      <h1>Enable microphone recording</h1>
      <p>
        xFrame needs microphone access to add your voice to recordings. Click below,
        then choose Allow in Chrome’s permission prompt.
      </p>
      <button id="allow" type="button">Allow microphone</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="microphone.js"></script>
  </body>
</html>
