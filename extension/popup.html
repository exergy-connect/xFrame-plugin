<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exergy ∞ xFrame</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg0: #0f1419;
        --bg1: #1a2430;
        --text: #e8eef5;
        --muted: #9aafc2;
        --line: rgba(197, 218, 240, 0.18);
        --accent0: #c5daf0;
        --accent1: #5a8ec4;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        overflow: hidden;
      }

      body {
        width: 320px;
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(165deg, var(--bg1), var(--bg0));
      }

      main {
        padding: 10px 12px 12px;
        display: grid;
        gap: 8px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand img.logo {
        width: 32px;
        height: 32px;
        display: block;
        object-fit: cover;
      }

      .brand img.mark {
        width: 18px;
        height: 18px;
      }

      .brand-text {
        display: grid;
        gap: 0;
        min-width: 0;
      }

      .brand-text h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }

      .brand-text p {
        margin: 0;
        font-size: 10px;
        color: var(--muted);
      }

      .marks {
        display: flex;
        align-items: center;
        margin-left: auto;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 3px;
        padding: 3px;
        border-radius: 9px;
        background: rgba(197, 218, 240, 0.08);
        border: 1px solid var(--line);
      }

      .tabs button {
        width: 100%;
        padding: 6px 4px;
        font-size: 11px;
        font-weight: 650;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        border: 0;
      }

      .tabs button[aria-selected="true"] {
        color: var(--bg0);
        background: linear-gradient(120deg, var(--accent0), var(--accent1));
      }

      .tabs button:disabled {
        opacity: 0.45;
      }

      /* Explicit height (set in JS) so Chrome's popup host doesn't resize on tab switch. */
      .panels {
        position: relative;
        width: 100%;
      }

      .panel {
        position: absolute;
        inset: 0;
        display: grid;
        gap: 7px;
        align-content: start;
        visibility: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .panel.is-active {
        visibility: visible;
        pointer-events: auto;
        z-index: 1;
      }

      .panel.active-session {
        align-content: center;
      }

      button {
        appearance: none;
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 8px 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
        color: var(--bg0);
        background: linear-gradient(120deg, var(--accent0), var(--accent1));
      }

      button:disabled {
        opacity: 0.65;
        cursor: default;
      }

      button.secondary {
        color: var(--text);
        background: rgba(197, 218, 240, 0.14);
        border: 1px solid var(--line);
      }

      button.danger {
        color: #f4f7fb;
        background: linear-gradient(120deg, #d96a6a, #b84242);
      }

      .active-session__row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }

      .active-session__dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #e25555;
        box-shadow: 0 0 0 0 rgba(226, 85, 85, 0.55);
        animation: frameit-pulse 1.4s ease-out infinite;
        flex-shrink: 0;
      }

      .active-session.is-paused .active-session__dot {
        background: #e0a84a;
        animation: none;
        box-shadow: none;
      }

      .active-session__time {
        font-variant-numeric: tabular-nums;
        font-weight: 650;
        font-size: 15px;
      }

      .active-session__actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }

      .active-session__actions button {
        width: 100%;
      }

      @keyframes frameit-pulse {
        0% { box-shadow: 0 0 0 0 rgba(226, 85, 85, 0.55); }
        70% { box-shadow: 0 0 0 10px rgba(226, 85, 85, 0); }
        100% { box-shadow: 0 0 0 0 rgba(226, 85, 85, 0); }
      }

      .options {
        display: grid;
        gap: 5px;
      }

      .option {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        font-size: 11px;
        line-height: 1.25;
        color: var(--text);
        cursor: pointer;
        user-select: none;
      }

      .option input {
        margin: 1px 0 0;
        accent-color: var(--accent1);
        flex-shrink: 0;
      }

      .logo-options {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 0 0 0 20px;
      }

      /* Keep space reserved so Record height stays stable when logo is off. */
      .logo-options.is-collapsed {
        visibility: hidden;
        pointer-events: none;
      }

      .logo-preview {
        width: 26px;
        height: 26px;
        object-fit: contain;
        border-radius: 5px;
        background: rgba(197, 218, 240, 0.08);
        border: 1px solid var(--line);
        flex-shrink: 0;
      }

      .logo-actions {
        display: grid;
        gap: 3px;
        min-width: 0;
        flex: 1;
      }

      .logo-actions button {
        width: 100%;
        padding: 4px 7px;
        font-size: 10px;
        font-weight: 600;
        border-radius: 6px;
      }

      .logo-actions button:disabled {
        opacity: 0.55;
      }

      /* Reserve the reset-button row so custom-logo state doesn't resize. */
      .logo-actions button.is-slot-hidden {
        visibility: hidden;
        pointer-events: none;
      }

      .field {
        display: grid;
        grid-template-columns: 72px 1fr;
        align-items: center;
        gap: 8px;
      }

      .field__label {
        font-size: 11px;
        color: var(--muted);
      }

      .select {
        width: 100%;
        appearance: none;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: rgba(197, 218, 240, 0.08);
        color: var(--text);
        font: inherit;
        font-size: 11px;
        padding: 5px 7px;
      }

      .status {
        min-height: 1em;
        font-size: 10px;
        color: var(--muted);
      }

      .status.error {
        color: #f0a0a0;
      }

      .hint {
        margin: 0;
        font-size: 10px;
        line-height: 1.3;
        color: var(--muted);
        min-height: 2.6em;
      }

      .modes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }

      .modes--format {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .mode {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 0;
        padding: 5px 6px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: rgba(197, 218, 240, 0.08);
        font-size: 10px;
        cursor: pointer;
        user-select: none;
      }

      .mode input {
        margin: 0;
        accent-color: var(--accent1);
        flex-shrink: 0;
      }

      .range-row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 8px;
      }

      .range-row input[type="range"] {
        width: 100%;
        accent-color: var(--accent1);
      }

      .range-value {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        min-width: 3.2em;
        text-align: right;
      }

      .number-input {
        width: 100%;
        appearance: textfield;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: rgba(197, 218, 240, 0.08);
        color: var(--text);
        font: inherit;
        font-size: 11px;
        padding: 5px 7px;
      }

      .source-note {
        margin: 0;
        font-size: 10px;
        line-height: 1.35;
        color: var(--muted);
        min-height: 2.4em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img
          class="logo"
          src="assets/exergy_connect_logo.png"
          alt="Exergy Connect"
          width="32"
          height="32"
        />
        <div class="brand-text">
          <h1>Exergy ∞ xFrame</h1>
          <p>Capture this tab</p>
        </div>
        <div class="marks">
          <img
            class="mark"
            src="assets/favicon.svg"
            alt=""
            width="18"
            height="18"
          />
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Capture mode">
        <button
          id="tabRecord"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="recordPanel"
        >
          Record
        </button>
        <button
          id="tabSnapshot"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="snapshotPanel"
        >
          Snapshot
        </button>
        <button
          id="tabAnimate"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="animatePanel"
        >
          Animate
        </button>
      </div>

      <div class="panels">
        <div
          id="recordPanel"
          class="panel is-active"
          role="tabpanel"
          aria-labelledby="tabRecord"
        >
          <div class="options">
            <label class="option" for="includeLogo">
              <input id="includeLogo" type="checkbox" checked />
              <span>Include logo (top right)</span>
            </label>
            <div id="logoOptions" class="logo-options">
              <img
                id="logoPreview"
                class="logo-preview"
                src="assets/exergy_connect_logo.png"
                alt="Recording logo preview"
                width="26"
                height="26"
              />
              <div class="logo-actions">
                <button id="chooseLogo" type="button" class="secondary">
                  Choose custom logo…
                </button>
              <button id="resetLogo" type="button" class="secondary is-slot-hidden">
                Use Exergy logo
              </button>
              </div>
              <input
                id="logoFile"
                type="file"
                accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"
                hidden
              />
            </div>

            <label class="option" for="hideControls">
              <input id="hideControls" type="checkbox" checked />
              <span>Hide controls from the video</span>
            </label>

            <label class="option" for="includePointer">
              <input id="includePointer" type="checkbox" />
              <span>Include mouse pointer</span>
            </label>

            <label class="option" for="includeAudio">
              <input id="includeAudio" type="checkbox" checked />
              <span>Include tab audio</span>
            </label>

            <label class="option" for="videoLinkedIn">
              <input id="videoLinkedIn" type="checkbox" />
              <span>Optimize for LinkedIn</span>
            </label>

            <div class="field">
              <label class="field__label" for="videoQuality">Quality</label>
              <select id="videoQuality" class="select">
                <option value="efficient">Efficient (~2 Mbps)</option>
                <option value="standard" selected>Standard (~5 Mbps)</option>
                <option value="high">High (~8 Mbps)</option>
                <option value="linkedin" hidden>LinkedIn (~6 Mbps)</option>
              </select>
            </div>
          </div>

          <button id="start" type="button">Start session</button>
        </div>

        <div
          id="snapshotPanel"
          class="panel"
          role="tabpanel"
          aria-labelledby="tabSnapshot"
        >
          <div class="field">
            <span class="field__label">Capture</span>
            <div class="modes">
              <label class="mode" for="snapshotModeFull">
                <input
                  id="snapshotModeFull"
                  type="radio"
                  name="snapshotMode"
                  value="full"
                  checked
                />
                <span>Visible tab</span>
              </label>
              <label class="mode" for="snapshotModeRegion">
                <input
                  id="snapshotModeRegion"
                  type="radio"
                  name="snapshotMode"
                  value="region"
                />
                <span>Region</span>
              </label>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="snapshotDelay">Delay</label>
            <select id="snapshotDelay" class="select">
              <option value="0">None</option>
              <option value="3">3 seconds</option>
              <option value="5" selected>5 seconds</option>
              <option value="10">10 seconds</option>
            </select>
          </div>

          <label class="option" for="snapshotLinkedIn">
            <input id="snapshotLinkedIn" type="checkbox" />
            <span>Optimize for LinkedIn (1280×644)</span>
          </label>

          <div class="field">
            <span class="field__label">Format</span>
            <div class="modes modes--format">
              <label class="mode" for="snapshotFormatPng">
                <input
                  id="snapshotFormatPng"
                  type="radio"
                  name="snapshotFormat"
                  value="png"
                  checked
                />
                <span>PNG</span>
              </label>
              <label class="mode" for="snapshotFormatJpg">
                <input
                  id="snapshotFormatJpg"
                  type="radio"
                  name="snapshotFormat"
                  value="jpg"
                />
                <span>JPG</span>
              </label>
              <label class="mode" for="snapshotFormatGif">
                <input
                  id="snapshotFormatGif"
                  type="radio"
                  name="snapshotFormat"
                  value="gif"
                />
                <span>GIF</span>
              </label>
            </div>
          </div>

          <button id="snapshot" type="button" class="secondary">
            Take snapshot
          </button>
        </div>

        <div
          id="animatePanel"
          class="panel"
          role="tabpanel"
          aria-labelledby="tabAnimate"
        >
          <p id="animateSource" class="source-note">
            Record a session first, then create a GIF from it.
          </p>

          <div class="field">
            <label class="field__label" for="gifFps">FPS</label>
            <input
              id="gifFps"
              class="number-input"
              type="number"
              min="1"
              max="30"
              step="1"
              value="10"
            />
          </div>

          <div class="field">
            <label class="field__label" for="gifSpeed">Speed</label>
            <div class="range-row">
              <input
                id="gifSpeed"
                type="range"
                min="10"
                max="500"
                step="10"
                value="100"
              />
              <span id="gifSpeedValue" class="range-value">100%</span>
            </div>
          </div>

          <label class="option" for="gifSpiralflow">
            <input id="gifSpiralflow" type="checkbox" />
            <span>Spiralflow (golden-ratio timing)</span>
          </label>

          <button id="createGif" type="button">Create GIF</button>
        </div>

        <div id="activeSession" class="panel active-session">
          <div class="active-session__row">
            <span class="active-session__dot" aria-hidden="true"></span>
            <span id="activeTime" class="active-session__time">00:00</span>
          </div>
          <div class="active-session__actions">
            <button id="pause" type="button" class="secondary">Pause</button>
            <button id="stop" type="button" class="danger">Stop &amp; save</button>
          </div>
          <button id="cancel" type="button" class="secondary">Cancel</button>
        </div>
      </div>

      <div id="status" class="status" role="status"></div>
      <p id="hint" class="hint">
        3-second countdown, then recording begins. Reopen to pause or stop.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
