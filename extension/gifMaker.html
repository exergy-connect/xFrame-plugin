<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Exergy ∞ xFrame — Creating GIF</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #e8eef5;
        background: linear-gradient(165deg, #1a2430, #0f1419);
      }
      main {
        width: min(92vw, 420px);
        display: grid;
        gap: 10px;
        padding: 20px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
      }
      #status {
        margin: 0;
        font-size: 13px;
        color: #9aafc2;
        line-height: 1.4;
        min-height: 2.8em;
      }
      #status.error {
        color: #f0a0a0;
      }
      progress {
        width: 100%;
        height: 8px;
        accent-color: #5a8ec4;
      }
      video {
        position: fixed;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
        left: -9999px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Creating animated GIF…</h1>
      <p id="status">Starting…</p>
      <progress id="bar" max="100" value="0"></progress>
    </main>
    <script src="recordingStore.js"></script>
    <script src="gifEncode.js"></script>
    <script src="gifMaker.js"></script>
  </body>
</html>
